name: Build MyLife AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, development/automation-studio]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages are installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]]; then
            sdkmanager "platforms;android-35" "build-tools;34.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Report unit test results
        run: cat app/build/test-results/testDebugUnitTest/TEST-*.xml

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeAI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable emulator hardware acceleration
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm

      - name: Launch app on Android 10
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            if adb shell pm list packages -e com.google.android.gms | grep -Fq package:com.google.android.gms; then adb shell pm disable-user --user 0 com.google.android.gms; fi
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.mylife.agent/.MainActivity | grep -F 'Status: ok'
            adb shell pidof com.mylife.agent
            adb shell uiautomator dump /sdcard/mylife-window.xml
            adb shell cat /sdcard/mylife-window.xml | grep -Fq 'text="MyLife AI"'
            adb exec-out screencap -p > mylife-dashboard.png
            bash -o pipefail -c 'python3 -u qa_android.py 2>&1 | tee qa-results.log'

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeAI-QA
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            qa-results.log
            mylife-dashboard.png
          if-no-files-found: warn
