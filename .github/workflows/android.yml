name: Build MyLife AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages are installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]]; then
            sdkmanager "platforms;android-35" "build-tools;34.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeAI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
